# CI: downloads the real Grand Turk OSM extract, builds + verifies the offline
# bundle, runs every test, builds Android APK/AAB, runs the journey test on an
# Android emulator, and builds iOS (unsigned) on macOS.
name: build-and-verify

on:
  push:
    branches: [main]
    paths-ignore: [tools/photos/**, .github/workflows/photos.yml, .github/workflows/photos-openverse.yml, .github/workflows/photos-geo.yml, .github/workflows/photo-previews.yml]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  data-and-android:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: pip install pillow

      - name: Download Grand Turk OpenStreetMap extract
        run: |
          mkdir -p data/raw
          BBOX="-71.17,21.40,-71.10,21.53"
          curl -fsSL --retry 3 -o data/raw/grand_turk.osm \
            "https://api.openstreetmap.org/api/0.6/map?bbox=${BBOX}" \
          || curl -fsSL --retry 3 -o data/raw/grand_turk.osm \
            "https://overpass-api.de/api/map?bbox=${BBOX}"
          ls -la data/raw

      - name: Gate 0-2 - build bundle, pipeline tests, route regression
        run: |
          python3 -I tools/pipeline/build_bundle.py --osm data/raw/grand_turk.osm
          python3 -m unittest discover -s tools/pipeline/tests -v
          python3 -I tools/pipeline/regression.py

      - uses: actions/setup-java@v5
        with: { distribution: temurin, java-version: '17' }
      - uses: subosito/flutter-action@v2
        with: { channel: stable, cache: true }

      - name: Gate 3 - analyze and test (logs kept)
        run: |
          mkdir -p ci-logs
          flutter --version > ci-logs/flutter_version.txt 2>&1
          flutter pub get > ci-logs/pub_get.txt 2>&1 || { cat ci-logs/pub_get.txt; exit 1; }
          set +e
          flutter analyze --no-fatal-infos --no-fatal-warnings > ci-logs/analyze.txt 2>&1; A=$?
          flutter test --reporter expanded > ci-logs/test.txt 2>&1; T=$?
          echo "analyze=$A test=$T" | tee ci-logs/gate3_status.txt
          tail -40 ci-logs/analyze.txt; tail -60 ci-logs/test.txt
          [ $A -eq 0 ] && [ $T -eq 0 ]

      - name: Gate 4 - Android release builds
        run: |
          flutter build apk --release > ci-logs/build_apk.txt 2>&1 || { tail -80 ci-logs/build_apk.txt; exit 1; }
          flutter build appbundle --release > ci-logs/build_aab.txt 2>&1 || { tail -80 ci-logs/build_aab.txt; exit 1; }

      - name: Publish logs to ci-logs branch
        if: always()
        run: |
          mkdir -p ci-logs && cp -f build/data_report.md build/route_regression.json ci-logs/ 2>/dev/null || true
          cp -f pubspec.lock ci-logs/ 2>/dev/null || true
          cd ci-logs && git init -q && git checkout -q -b ci-logs
          git -c user.name=ci -c user.email=ci@localhost add -A
          git -c user.name=ci -c user.email=ci@localhost commit -q -m "CI logs run ${{ github.run_number }} (${{ job.status }})"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}" ci-logs

      - name: Publish Android build as a GitHub release
        if: success()
        env: { GH_TOKEN: "${{ secrets.GITHUB_TOKEN }}" }
        run: |
          cp build/app/outputs/flutter-apk/app-release.apk TCI_Beach_Buddies.apk
          cp build/app/outputs/bundle/release/app-release.aab TCI_Beach_Buddies.aab
          gh release create "build-${{ github.run_number }}" TCI_Beach_Buddies.apk TCI_Beach_Buddies.aab \
            build/route_regression.png build/data_report.md \
            --title "Build ${{ github.run_number }} (QA, debug-signed)" --prerelease \
            --notes "Automated build from ${{ github.sha }}. QA build signed with debug keys - not for store distribution."

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-and-data
          path: |
            build/data_report.md
            build/route_regression.json
            build/route_regression.png
            build/app/outputs/flutter-apk/app-release.apk
            build/app/outputs/bundle/release/app-release.aab
            assets/
            test/fixtures/regression_routes.json
            pubspec.lock

  android-emulator-journey:
    needs: data-and-android
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: { name: android-and-data, path: artifact }
      - run: cp -r artifact/assets/* assets/
      - uses: actions/setup-java@v5
        with: { distribution: temurin, java-version: '17' }
      - uses: subosito/flutter-action@v2
        with: { channel: stable, cache: true }
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm
      - name: Journey test on emulator with networking disabled
        timeout-minutes: 30
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          script: |
            adb shell svc wifi disable; adb shell svc data disable
            mkdir -p emu-logs; flutter test integration_test/offline_journey_test.dart -d emulator-5554 > emu-logs/journey.txt 2>&1; echo $? > emu-logs/status.txt; tail -80 emu-logs/journey.txt; exit $(cat emu-logs/status.txt)
      - name: Publish emulator logs
        if: always()
        run: |
          mkdir -p emu-logs && cd emu-logs && git init -q && git checkout -q -b ci-logs-emulator
          git -c user.name=ci -c user.email=ci@localhost add -A
          git -c user.name=ci -c user.email=ci@localhost commit -q --allow-empty -m "emulator logs run ${{ github.run_number }}"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}" ci-logs-emulator

  ios-build:
    needs: data-and-android
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: { name: android-and-data, path: artifact }
      - run: cp -r artifact/assets/* assets/
      - uses: subosito/flutter-action@v2
        with: { channel: stable, cache: true }
      - name: iOS build (unsigned - signing needs an Apple Developer team)
        run: |
          flutter pub get
          cd ios && pod install && cd ..
          flutter build ios --release --no-codesign
          cd build/ios/iphoneos && mkdir Payload && cp -r Runner.app Payload/ && zip -qr ../TCI_Beach_Buddies_unsigned.ipa Payload
      - uses: actions/upload-artifact@v4
        with:
          name: ios-unsigned
          path: build/ios/TCI_Beach_Buddies_unsigned.ipa
