# Fetch Wikimedia Commons photo candidates (free licences) for review.
name: fetch-photo-candidates
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [tools/photos/fetch_candidates.py]
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - run: python3 tools/photos/fetch_candidates.py photo-candidates
        env:
          ONLY_IDS: governors-beach,pillory-beach,boaby-rock-beach,white-sands-beach,hm-prison,st-marys,st-thomas,waterloo,odd-fellows-lodge,victoria-library,town-salina,red-salina,hawks-nest-salina,gibbs-cay,jacks-shack,sand-bar,salt-raker-inn,bohio,shoprite-grocery,ron-jon-surf-shop,harbor-house,medical-centre,police-station,post-office,scotiabank
      - name: Publish candidates branch
        run: |
          cd photo-candidates && git init -q && git checkout -q -b photo-candidates-2
          git -c user.name=ci -c user.email=ci@localhost add -A
          git -c user.name=ci -c user.email=ci@localhost commit -q -m "photo candidates run ${{ github.run_number }}"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}" photo-candidates-2
