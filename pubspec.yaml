name: tci_beach_buddies
description: TCI Beach Buddies - offline Grand Turk tourist navigation (Android + iOS).
publish_to: 'none'

# App version. The offline data bundle carries its own versions in
# assets/manifest/manifest.json; both are shown on the Settings screen.
version: 1.0.0+1

environment:
  sdk: ^3.6.0

# Dependency policy (TDD 2.2): keep native plugins to the minimum.
#  - flutter_map renders the bundled vector basemap. NO tile layer / no URLs.
#  - geolocator is the only location plugin (foreground only).
#  - shared_preferences stores settings + favourites locally.
#  - crypto verifies SHA-256 hashes of the offline bundle at start-up.
# Run `flutter pub get` and COMMIT the generated pubspec.lock to freeze versions.
dependencies:
  flutter:
    sdk: flutter
  flutter_map: ^8.0.0
  latlong2: ^0.9.1
  geolocator: ^14.0.0
  shared_preferences: ^2.3.0
  crypto: ^3.0.3
  # Offline voice guidance via the device's built-in text-to-speech engine.
  flutter_tts: ^4.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/manifest/
    - assets/map/
    - assets/graph/
    - assets/pois/
    - assets/photos/
  # Friendly rounded type for the vibrant look (SIL Open Font Licence,
  # licences in assets/fonts/OFL-*.txt). Latin subsets, bundled for offline.
  fonts:
    - family: Baloo2
      fonts:
        - asset: assets/fonts/Baloo2-600.ttf
          weight: 600
        - asset: assets/fonts/Baloo2-700.ttf
          weight: 700
        - asset: assets/fonts/Baloo2-800.ttf
          weight: 800
    - family: Nunito
      fonts:
        - asset: assets/fonts/Nunito-500.ttf
          weight: 500
        - asset: assets/fonts/Nunito-600.ttf
          weight: 600
        - asset: assets/fonts/Nunito-700.ttf
          weight: 700
        - asset: assets/fonts/Nunito-800.ttf
          weight: 800
        - asset: assets/fonts/Nunito-900.ttf
          weight: 900
